# Cloudflare Pages project for zoomedart.com: the static site in dist/ plus the comment API in functions/.
# Launch steps (once): see "Comments" in README.md.
name = "zoomedart"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "zoomedart-comments"
# Filled in at launch from `npx wrangler d1 create zoomedart-comments`; the local database ignores it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
